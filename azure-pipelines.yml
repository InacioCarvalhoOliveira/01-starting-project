name: azure tests pipeline AmusementPark

trigger:
- azure-pipelines

pool: 
  name: 'AZ-Pool' # Using your hosted agent

variables:
  nodeJsVersion: '18.x' # Recommended Node.js version for Angular

stages:
- stage: 'Build'
  displayName: 'Build Stage'
  jobs:
  - job: 'Build'
    displayName: 'Build Job'
    
    steps:
    - checkout: self
      displayName: 'Checkout Code'

    - task: NodeTool@0
      displayName: 'Set Up Node.js'
      inputs:
        versionSpec: '$(nodeJsVersion)'

    - script: npm install
      displayName: 'Install Dependencies'

    - script: npm install -g @angular/cli@19.2.0
      displayName: 'Install Angular CLI'

    - script: npm run build --prod
      displayName: 'Build Angular Application'

- stage: 'Test'
  displayName: 'Test Stage'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: 'Test'
    displayName: 'Test Job'
    
    steps:
    - checkout: self
      displayName: 'Checkout Code for Tests'

    - script: ng test --watch=false
      displayName: 'Run Angular Tests'
